services:
  raccoon-rdpproxy:
    build: .
    image: raccoon-rdpproxy:latest
    container_name: raccoon-rdpproxy
    # Host networking is required because of dual-homing (192.168.1.x / 192.168.2.x) and source binding.
    # With host networking the listen ports (3389 etc.) open directly on the host (no ports mapping needed).
    network_mode: host
    restart: unless-stopped
    volumes:
      # Holds appsettings.json (Proxy:Maps, credentials, log settings) and proxy.pfx; resolved via WORKDIR=/cfg.
      - /opt/raccoon-rdpproxy:/cfg
    # chmod 600 /opt/raccoon-rdpproxy/appsettings.json is recommended since it holds credentials.
    # Log volume is tuned with Serilog:MinimumLevel in appsettings.json (default Information = quiet / Debug = verbose).
